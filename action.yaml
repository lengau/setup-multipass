name: Setup Multipass
description: Set up Multipass on a GitHub runner
inputs:
  wait:
    description: Wait for Multipass to complete install and startup
    default: true

runs:
  using: "composite"
  steps:
    - if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo snap install multipass
        sudo chown "${USER}:$(groups | cut -d' ' -f1)" /var/snap/multipass/common/multipass_socket
        echo "/snap/bin" >> "$GITHUB_PATH"
    - if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install --cask multipass
        if [ -d "/usr/local/bin" ]; then
          echo "/usr/local/bin" >> "$GITHUB_PATH"
        fi
        if [ -d "/opt/homebrew/bin" ]; then
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        fi
    - if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        winget install --id Canonical.Multipass --source winget --accept-package-agreements --accept-source-agreements --silent
        $maxRetries = 30
        $retryCount = 0
        $found = $false
        while (-not $found -and $retryCount -lt $maxRetries) {
          $paths = @("C:\Program Files\Multipass\bin", "C:\Program Files\Multipass")
          foreach ($path in $paths) {
            if (Test-Path "$path\multipass.exe") {
              Write-Host "Found Multipass at $path"
              "$path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "Waiting for Multipass to be installed... ($($retryCount + 1)/$maxRetries)"
            Start-Sleep -Seconds 10
            $retryCount++
          }
        }
        if (-not $found) {
          Write-Error "Multipass not found after installation."
          exit 1
        }
    - if: ${{ inputs.wait == 'true' }}
      shell: bash
      run: |
        echo Waiting until Multipass is up...
        # Ensure we can find multipass
        PATH="/snap/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
        while ! multipass list; do
          sleep 1
        done
        echo Updating multipass remotes...
        multipass find --force-update
    - if: ${{ runner.os == 'macOS' }}
      name: Configure runner to run multipass as root
      # Workaround for https://github.com/canonical/multipass/issues/4588
      shell: bash
      run: |
        multipass_passphrase=$(uuidgen)
        # We need to wait for the daemon to be up before setting the passphrase
        echo Waiting until Multipass is up...
        # Use full path just in case
        MULTIPASS_BIN=$(which multipass || echo "/usr/local/bin/multipass")
        while ! "$MULTIPASS_BIN" list; do
          sleep 1
        done
        sudo "$MULTIPASS_BIN" set local.passphrase=$multipass_passphrase
        while ! sudo "$MULTIPASS_BIN" authenticate $multipass_passphrase; do
          sleep 1
        done
        sudo mv "$MULTIPASS_BIN" "${MULTIPASS_BIN}-real"
        printf "#!/bin/bash\nexec /usr/bin/sudo -E \"${MULTIPASS_BIN}-real\" \"\$@\"" | sudo tee "$MULTIPASS_BIN"
        sudo chmod a+x "$MULTIPASS_BIN"
