name: Setup Multipass
description: Set up Multipass on a GitHub runner
inputs:
  wait:
    description: Wait for Multipass to complete install and startup
    default: true

runs:
  using: "composite"
  steps:
    - if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo snap install multipass
        sudo chown "${USER}:$(groups | cut -d' ' -f1)" /var/snap/multipass/common/multipass_socket
        echo "/snap/bin" >> "$GITHUB_PATH"
    - if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: |
        brew install --cask multipass
        if [ -d "/usr/local/bin" ]; then
          echo "/usr/local/bin" >> "$GITHUB_PATH"
        fi
        if [ -d "/opt/homebrew/bin" ]; then
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
        fi
    - if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $multipassPath = $null
        # Check if already in PATH
        $cmd = Get-Command multipass -ErrorAction SilentlyContinue
        if ($cmd) {
          $multipassPath = Split-Path $cmd.Definition
          Write-Host "Multipass already in PATH at $multipassPath"
        }
        # Check Registry
        if (-not $multipassPath) {
          $regPath = "HKLM:\SOFTWARE\Canonical\Multipass"
          if (Test-Path $regPath) {
            $multipassPath = Get-ItemProperty -Path $regPath -Name "InstallDir" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty "InstallDir"
            if ($multipassPath) {
              Write-Host "Multipass found in Registry at $multipassPath"
              if (Test-Path "$multipassPath\bin") { $multipassPath = "$multipassPath\bin" }
            }
          }
        }
        # Install if not found
        if (-not $multipassPath) {
          # Try to enable Hyper-V
          Write-Host "Enabling Hyper-V..."
          dism.exe /online /enable-feature /featurename:Microsoft-Hyper-V-All /norestart
          # Try to start Hyper-V service
          sc.exe start vmms
          $msiPath = "${{ runner.temp }}\multipass.msi"
          Write-Host "Downloading Multipass..."
          curl -o $msiPath -L https://canonical.com/multipass/download/windows
          Write-Host "Installing Multipass..."
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i", "$msiPath", "/quiet", "/norestart"
          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 1638) { # 1638 is "already installed"
            Write-Host "msiexec /i failed with exit code $($process.ExitCode). Trying winget as fallback."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install --id Canonical.Multipass --source winget --accept-package-agreements --accept-source-agreements --silent
            }
          }
        }
        # Search again after installation
        $maxRetries = 30
        $retryCount = 0
        $found = $false
        while (-not $found -and $retryCount -lt $maxRetries) {
          $paths = @("C:\Program Files\Multipass\bin", "C:\Program Files\Multipass", "${{ runner.temp }}\Multipass", "${{ runner.temp }}\Multipass\bin")
          if ($multipassPath) { $paths = @($multipassPath) + $paths }
          foreach ($path in $paths) {
            if (Test-Path "$path\multipass.exe") {
              Write-Host "Found Multipass at $path"
              Add-Content -Path $env:GITHUB_PATH -Value "$path"
              # Update current process path too
              $env:PATH = "$path;$env:PATH"
              # Set driver to hyperv
              Write-Host "Setting driver to hyperv..."
              & "$path\multipass.exe" set local.driver=hyperv
              # Also add unix-style path for bash
              $unixPath = $path.Replace("\", "/").Replace("C:", "/c")
              Add-Content -Path $env:GITHUB_PATH -Value "$unixPath"
              echo "MULTIPASS_DIR=$unixPath" >> $env:GITHUB_ENV
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "Searching for multipass.exe on C:..."
            $foundFile = Get-ChildItem -Path C:\ -Filter multipass.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundFile) {
              $path = Split-Path $foundFile.FullName
              Write-Host "Found Multipass at $path via recursive search"
              Add-Content -Path $env:GITHUB_PATH -Value "$path"
              $env:PATH = "$path;$env:PATH"
              & "$path\multipass.exe" set local.driver=hyperv
              $unixPath = $path.Replace("\", "/").Replace("C:", "/c")
              Add-Content -Path $env:GITHUB_PATH -Value "$unixPath"
              echo "MULTIPASS_DIR=$unixPath" >> $env:GITHUB_ENV
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "Waiting for Multipass to be installed... ($($retryCount + 1)/$maxRetries)"
            Start-Sleep -Seconds 10
            $retryCount++
          }
        }
        if (-not $found) {
          Write-Error "Multipass not found after installation."
          exit 1
        }
    - if: ${{ runner.os == 'Windows' }}
      shell: bash
      run: |
        # Ensure we add common paths to GITHUB_PATH in bash format
        echo "/c/Program Files/Multipass/bin" >> "$GITHUB_PATH"
        echo "/c/Program Files/Multipass" >> "$GITHUB_PATH"
    - if: ${{ inputs.wait == 'true' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Write-Host "Waiting until Multipass is up..."
        $maxWait = 300
        $elapsed = 0
        # Update current process path again just in case
        $paths = @("C:\Program Files\Multipass\bin", "C:\Program Files\Multipass", "${{ runner.temp }}\Multipass", "${{ runner.temp }}\Multipass\bin")
        foreach ($path in $paths) {
          if (Test-Path "$path\multipass.exe") {
            $env:PATH = "$path;$env:PATH"
            break
          }
        }
        while ($elapsed -lt $maxWait) {
          if (& multipass list 2>$null) {
            Write-Host "Multipass is up!"
            & multipass find --force-update
            return
          }
          Start-Sleep -Seconds 1
          $elapsed++
        }
        Write-Error "Multipass failed to start within $maxWait seconds."
        exit 1
    - if: ${{ inputs.wait == 'true' && runner.os != 'Windows' }}
      shell: bash
      run: |
        echo Waiting until Multipass is up...
        # Ensure we can find multipass
        PATH="/snap/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
        while ! multipass list; do
          sleep 1
        done
        echo Updating multipass remotes...
        multipass find --force-update
    - if: ${{ runner.os == 'macOS' }}
      name: Configure runner to run multipass as root
      # Workaround for https://github.com/canonical/multipass/issues/4588
      shell: bash
      run: |
        # Use full path just in case
        MULTIPASS_BIN=$(which multipass || echo "/usr/local/bin/multipass")
        echo Waiting until Multipass is up...
        while ! "$MULTIPASS_BIN" list; do
          sleep 1
        done
        multipass_passphrase=$(uuidgen)
        # Try setting passphrase with sudo -n
        sudo -n "$MULTIPASS_BIN" set local.passphrase=$multipass_passphrase || "$MULTIPASS_BIN" set local.passphrase=$multipass_passphrase || true
        # Authenticate with sudo, but don't fail if it fails
        sudo -n "$MULTIPASS_BIN" authenticate $multipass_passphrase || true
        sudo mv "$MULTIPASS_BIN" "${MULTIPASS_BIN}-real"
        printf "#!/bin/bash\nexec /usr/bin/sudo -E \"${MULTIPASS_BIN}-real\" \"\$@\"" | sudo tee "$MULTIPASS_BIN"
        sudo chmod a+x "$MULTIPASS_BIN"
        # Verify it works
        "$MULTIPASS_BIN" version
